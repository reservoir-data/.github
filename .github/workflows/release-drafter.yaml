name: Release Drafter

# Reusable workflow. Call it from a repository with:
#
#   on:
#     push:
#       branches: [main]
#   permissions: {}
#   jobs:
#     release-drafter:
#       permissions:
#         contents: write
#       uses: reservoir-data/.github/.github/workflows/release-drafter.yaml@main
#
# The configuration is loaded from the repository's own `.github/release-drafter.yml`
# if present, otherwise from this repository's `.github/release-drafter.yml`.

on:
  workflow_call:

permissions: {}

jobs:
  update_release_draft:
    name: Update release draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # to create/update the draft release
    steps:
      - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
